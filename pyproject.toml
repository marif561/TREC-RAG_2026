[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmlab-rag"
version = "0.1.0"
description = "DM-Lab at TREC 2026 RAG: multi-query retrieval, ensemble judging and claim-pack generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["openai>=1.40", "requests>=2.31", "pyyaml>=6.0", "tqdm>=4.66"]

[project.optional-dependencies]
lucene = ["pyserini>=0.43"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
